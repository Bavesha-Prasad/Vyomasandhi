<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090B" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>VYOMASANDHI — Ideas, thoughtfully brought to life.</title>
  </head>
  <body>
    <!-- Netlify form detection template for build/deploy time -->
    <form name="contact" data-netlify="true" netlify hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="serviceType">
        <option value="Business Website">Business Website</option>
        <option value="Landing Page">Landing Page</option>
        <option value="Website Redesign">Website Redesign</option>
      </select>
      <select name="budget">
        <option value="Not sure yet">Not sure yet</option>
        <option value="Starting ~$200">Starting ~$200</option>
        <option value="$200–$500">$200–$500</option>
        <option value="$500+">$500+</option>
      </select>
      <textarea name="details"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
